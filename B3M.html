<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ГОЛОГРАММА — РЕДАКТОР</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c:#00f0ff;--b:#001018;--b2:#002030;--t:#c0f0ff;--d:#4080a0;--r:#ff3060;--g:#00ff80;--y:#ffaa00}
body{background:var(--b);color:var(--t);font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden;background-image:linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px),radial-gradient(ellipse at center,var(--b2) 0%,var(--b) 70%);background-size:40px 40px,40px 40px,100% 100%}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(transparent 50%,rgba(0,240,255,.02) 50%);background-size:100% 4px;pointer-events:none;z-index:9999;animation:scan 8s linear infinite}
@keyframes scan{0%{background-position:0 0}100%{background-position:0 100%}}
.glow{text-shadow:0 0 10px currentColor,0 0 20px currentColor}
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;background:rgba(0,16,24,.95)}
#login h1{font-size:clamp(28px,8vw,64px);color:var(--c);text-shadow:0 0 20px var(--c),0 0 40px var(--c);letter-spacing:.3em;margin-bottom:8px;animation:flk 3s infinite}
@keyframes flk{0%,92%,94%,97%,100%{opacity:1}93%{opacity:.6}96%{opacity:.8}}
#login .sub{color:var(--d);font-size:13px;margin-bottom:40px;letter-spacing:.1em}
#login input{background:rgba(0,240,255,.05);border:1px solid var(--c);color:var(--t);padding:12px 20px;font-family:inherit;font-size:16px;border-radius:4px;outline:none;text-align:center;letter-spacing:.1em;width:250px;max-width:80vw;box-shadow:0 0 10px rgba(0,240,255,.2),inset 0 0 10px rgba(0,240,255,.1);transition:.3s}
#login input:focus{box-shadow:0 0 20px rgba(0,240,255,.5),inset 0 0 10px rgba(0,240,255,.2)}
#login button{margin-top:16px;padding:12px 40px;background:transparent;border:1px solid var(--c);color:var(--c);font-family:inherit;font-size:14px;letter-spacing:.2em;cursor:pointer;border-radius:4px;transition:.3s}
#login button:hover{background:rgba(0,240,255,.1);box-shadow:0 0 20px rgba(0,240,255,.4)}
.lerr{color:var(--r);margin-top:12px;font-size:13px;min-height:18px;text-shadow:0 0 10px var(--r)}
#app{display:none;flex-direction:column;min-height:100vh}
.sbar{padding:6px 16px;font-size:11px;color:var(--d);letter-spacing:.05em;border-bottom:1px solid rgba(0,240,255,.1);display:flex;gap:16px;flex-wrap:wrap}
.sbar .pub{color:var(--g)} .sbar .dr{color:var(--y)}
.tbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(0,240,255,.2);flex-wrap:wrap;background:rgba(0,16,24,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
.tbar .logo{font-size:18px;color:var(--c);text-shadow:0 0 10px var(--c);letter-spacing:.2em;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;padding:4px 0;scrollbar-width:thin;scrollbar-color:var(--c) transparent}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:var(--c);border-radius:2px}
.tab{padding:8px 14px;border:1px solid rgba(0,240,255,.3);background:rgba(0,240,255,.03);color:var(--t);cursor:pointer;border-radius:4px;font-size:13px;white-space:nowrap;transition:.2s;font-family:inherit;display:flex;align-items:center;gap:4px}
.tab:hover{border-color:var(--c);background:rgba(0,240,255,.08)}
.tab.active{border-color:var(--c);background:rgba(0,240,255,.15);box-shadow:0 0 15px rgba(0,240,255,.3);color:var(--c)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.g{background:var(--g);box-shadow:0 0 6px var(--g)}
.dot.y{background:var(--y);box-shadow:0 0 6px var(--y)}
.btn{padding:8px 16px;border:1px solid rgba(0,240,255,.4);background:rgba(0,240,255,.05);color:var(--c);cursor:pointer;border-radius:4px;font-size:13px;font-family:inherit;letter-spacing:.05em;transition:.2s;white-space:nowrap}
.btn:hover{background:rgba(0,240,255,.15);box-shadow:0 0 12px rgba(0,240,255,.3);border-color:var(--c)}
.btn.d{border-color:rgba(255,48,96,.4);color:var(--r);background:rgba(255,48,96,.05)}
.btn.d:hover{background:rgba(255,48,96,.15);box-shadow:0 0 12px rgba(255,48,96,.3)}
.btn.s{border-color:rgba(0,255,128,.4);color:var(--g);background:rgba(0,255,128,.05)}
.btn.s:hover{background:rgba(0,255,128,.15);box-shadow:0 0 12px rgba(0,255,128,.3)}
.content{flex:1;padding:24px 16px;max-width:900px;margin:0 auto;width:100%}
.pcard{background:rgba(0,240,255,.02);border:1px solid rgba(0,240,255,.15);border-radius:8px;padding:24px;min-height:300px;white-space:pre-wrap;word-wrap:break-word;line-height:1.8;font-size:15px;box-shadow:0 0 30px rgba(0,240,255,.05),inset 0 0 20px rgba(0,240,255,.02);position:relative}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.5}
.earea{width:100%;min-height:300px;background:rgba(0,240,255,.05);border:1px solid var(--c);border-radius:8px;padding:24px;color:var(--t);font-family:inherit;font-size:15px;line-height:1.8;resize:vertical;outline:none;box-shadow:0 0 20px rgba(0,240,255,.15),inset 0 0 10px rgba(0,240,255,.05)}
.earea:focus{box-shadow:0 0 30px rgba(0,240,255,.3),inset 0 0 10px rgba(0,240,255,.1)}
.empty{text-align:center;padding:60px 20px;color:var(--d);font-size:14px;letter-spacing:.1em}
.pstat{font-size:11px;margin-bottom:8px;letter-spacing:.05em}
.apanel{display:none;gap:8px;padding:12px 16px;border-top:1px solid rgba(0,240,255,.15);flex-wrap:wrap;background:rgba(0,16,24,.8);backdrop-filter:blur(10px)}
.ainfo{color:var(--d);font-size:12px;align-self:center;margin-right:auto;letter-spacing:.05em}
.ovr{position:fixed;inset:0;background:rgba(0,16,24,.92);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.mdl{background:var(--b);border:1px solid var(--c);border-radius:8px;padding:24px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 0 40px rgba(0,240,255,.3)}
.mdl h2{color:var(--c);font-size:18px;margin-bottom:16px;letter-spacing:.1em}
.mdl p{color:var(--t);font-size:14px;line-height:1.6;margin-bottom:12px}
.mdl textarea{width:100%;height:200px;background:rgba(0,240,255,.05);border:1px solid rgba(0,240,255,.3);color:var(--t);padding:12px;font-family:monospace;font-size:11px;border-radius:4px;resize:vertical;outline:none}
.brow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.plist{max-height:300px;overflow-y:auto;border:1px solid rgba(0,240,255,.2);border-radius:4px;padding:8px}
.pitem{padding:8px 12px;border-bottom:1px solid rgba(0,240,255,.1);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.pitem:last-child{border-bottom:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,16,24,.95);border:1px solid var(--c);color:var(--c);padding:12px 24px;border-radius:4px;font-size:13px;z-index:300;box-shadow:0 0 20px rgba(0,240,255,.3);animation:tIn .3s ease;letter-spacing:.05em}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.dlg{background:rgba(0,16,24,.95);border:1px solid var(--r);border-radius:8px;padding:20px;max-width:400px;width:100%;box-shadow:0 0 30px rgba(255,48,96,.2)}
.dlg h3{color:var(--r);font-size:16px;margin-bottom:12px;letter-spacing:.1em}
.dlg .prev{color:var(--t);font-size:13px;line-height:1.6;margin-bottom:16px;padding:12px;background:rgba(0,240,255,.05);border-radius:4px;max-height:120px;overflow-y:auto;white-space:pre-wrap}
.dlg .warn{color:var(--y);font-size:12px;margin-bottom:16px}
@media(max-width:600px){.tbar{padding:8px}.tbar .logo{font-size:14px;letter-spacing:.1em}.tab{padding:6px 10px;font-size:12px}.content{padding:12px}.pcard,.earea{padding:16px;font-size:14px}.apanel{padding:8px}.btn{padding:6px 10px;font-size:12px}.ainfo{font-size:11px;width:100%;margin-bottom:4px}.sbar{font-size:10px;gap:8px}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(0,240,255,.02)}
::-webkit-scrollbar-thumb{background:rgba(0,240,255,.2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,240,255,.4)}
</style>
</head>
<body>

<div id="login">
  <h1 class="glow">ГОЛОГРАММА</h1>
  <div class="sub">/// ВВЕДИТЕ ПАРОЛЬ ДОСТУПА ///</div>
  <input type="password" id="pwd" placeholder="• • • • • •" autocomplete="off">
  <button id="loginBtn">ВОЙТИ</button>
  <div class="lerr" id="lerr"></div>
</div>

<div id="app">
  <div class="sbar" id="sbar"></div>
  <div class="tbar">
    <div class="logo glow">◈ ГОЛОГРАММА</div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="content"><div id="pdisp"></div></div>
  <div class="apanel" id="apanel">
    <span class="ainfo" id="ainfo">РЕЖИМ: АДМИН</span>
    <button class="btn" id="newBtn">+ СТРАНИЦА</button>
    <button class="btn" id="editBtn">РЕДАКТИРОВАТЬ</button>
    <button class="btn d" id="delBtn">УДАЛИТЬ</button>
    <button class="btn" id="pubBtn">ВИДНЫЕ ЗРИТЕЛЯМ</button>
    <button class="btn s" id="copyBtn">СКОПИРОВАТЬ КОД</button>
    <button class="btn" id="outBtn">ВЫХОД</button>
  </div>
</div>

<script>
var PUBLISHED_PAGES = /* PUBLISHED_PAGES_START */ {} /* PUBLISHED_PAGES_END */;
var VPWD = "взб", APWD = "4goosE", SK = "hologram_drafts";
var user = null, curPage = 1, editing = false;

document.getElementById('loginBtn').onclick = login;
document.getElementById('pwd').addEventListener('keydown', function(e){if(e.key==='Enter')login();});
document.getElementById('newBtn').onclick = newPage;
document.getElementById('editBtn').onclick = toggleEdit;
document.getElementById('delBtn').onclick = deletePage;
document.getElementById('pubBtn').onclick = showPublished;
document.getElementById('copyBtn').onclick = copyCode;
document.getElementById('outBtn').onclick = logout;

function login(){
  var p = document.getElementById('pwd').value;
  var err = document.getElementById('lerr');
  if(p === APWD){ user = 'admin'; }
  else if(p === VPWD){ user = 'viewer'; }
  else { err.textContent = 'НЕВЕРНЫЙ ПАРОЛЬ'; document.getElementById('pwd').value=''; return; }
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  if(user === 'admin') document.getElementById('apanel').style.display='flex';
  render();
}

function getDrafts(){ try{ return JSON.parse(localStorage.getItem(SK)||'{}'); }catch(e){ return {}; } }
function saveDrafts(d){ localStorage.setItem(SK, JSON.stringify(d)); }

function getAllPages(){
  var d = getDrafts(), pages = {};
  for(var k in PUBLISHED_PAGES) pages[k] = PUBLISHED_PAGES[k];
  if(user === 'admin'){
    for(var k2 in d){
      if(d[k2] === null) delete pages[k2];
      else pages[k2] = d[k2];
    }
  }
  return pages;
}

function getNums(){ return Object.keys(getAllPages()).map(Number).sort(function(a,b){return a-b;}); }
function isPub(n){ return PUBLISHED_PAGES.hasOwnProperty(String(n)); }
function isModified(n){
  var d = getDrafts(), k = String(n);
  if(!d.hasOwnProperty(k)) return false;
  if(d[k] === null) return true;
  if(!PUBLISHED_PAGES.hasOwnProperty(k)) return true;
  return d[k] !== PUBLISHED_PAGES[k];
}

function esc(t){ var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

function render(){ renderSbar(); renderTabs(); renderPage(); }

function renderSbar(){
  var pc = Object.keys(PUBLISHED_PAGES).length;
  var d = getDrafts(), mc = 0;
  for(var k in d){ if(d[k]===null || !PUBLISHED_PAGES.hasOwnProperty(k) || d[k]!==PUBLISHED_PAGES[k]) mc++; }
  var h = '<span>СТАТУС: '+(user==='admin'?'АДМИН':'ЗРИТЕЛЬ')+'</span>';
  h += '<span class="pub">ОПУБЛИКОВАНО: '+pc+'</span>';
  if(user==='admin') h += '<span class="dr">ЧЕРНОВИКОВ: '+mc+'</span>';
  h += '<span>СТРАНИЦА: '+curPage+'</span>';
  document.getElementById('sbar').innerHTML = h;
}

function renderTabs(){
  var nums = getNums(), h = '';
  if(nums.length === 0 && user !== 'admin'){
    document.getElementById('tabs').innerHTML = '<span style="color:var(--d);padding:8px;font-size:13px">НЕТ СТРАНИЦ</span>';
    return;
  }
  for(var i=0;i<nums.length;i++){
    var n = nums[i], act = n===curPage, badge = '';
    if(user==='admin'){
      if(isModified(n)) badge = '<span class="dot y" title="Не опубликовано"></span>';
      else if(isPub(n)) badge = '<span class="dot g" title="Опубликовано"></span>';
    }
    h += '<div class="tab'+(act?' active':'')+'" onclick="goToPage('+n+')">Стр.'+n+badge+'</div>';
  }
  document.getElementById('tabs').innerHTML = h;
}

function renderPage(){
  var disp = document.getElementById('pdisp'), pages = getAllPages(), nums = getNums();
  if(editing && user === 'admin'){
    var c = pages[String(curPage)] || '';
    disp.innerHTML = '<textarea class="earea" id="earea" placeholder="Введите текст страницы..."></textarea>'+
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn s" onclick="saveEdit()">СОХРАНИТЬ ЧЕРНОВИК</button>'+
      '<button class="btn" onclick="cancelEdit()">ОТМЕНА</button></div>';
    document.getElementById('earea').value = c;
    document.getElementById('earea').focus();
    return;
  }
  if(nums.length === 0){
    disp.innerHTML = '<div class="empty">/// СТРАНИЦЫ ОТСУТСТВУЮТ ///</div>'; return;
  }
  if(!pages.hasOwnProperty(String(curPage))) curPage = nums[0] || 1;
  var pc = pages[String(curPage)] || '', stat = '';
  if(user === 'admin'){
    if(isModified(curPage)) stat = '<div class="pstat" style="color:var(--y)">⚠ ЧЕРНОВИК — не виден зрителям</div>';
    else if(isPub(curPage)) stat = '<div class="pstat" style="color:var(--g)">✓ ОПУБЛИКОВАНО — виден зрителям</div>';
  }
  if(pc.trim() === '') disp.innerHTML = stat + '<div class="pcard empty">/// ПУСТАЯ СТРАНИЦА '+curPage+' ///</div>';
  else disp.innerHTML = stat + '<div class="pcard">'+esc(pc)+'</div>';
}

function goToPage(n){
  if(editing){ if(!confirm('Выйти из редактирования без сохранения?')) return; editing = false; }
  curPage = n; render();
}

function newPage(){
  if(editing){ if(!confirm('Выйти из редактирования без сохранения?')) return; editing = false; }
  var nums = getNums(), next = nums.length > 0 ? nums[nums.length-1]+1 : 1;
  var d = getDrafts(); d[String(next)] = ''; saveDrafts(d);
  curPage = next; editing = true; render();
}

function toggleEdit(){
  if(editing) return;
  var pages = getAllPages();
  if(!pages.hasOwnProperty(String(curPage))){
    var d = getDrafts(); d[String(curPage)] = ''; saveDrafts(d);
  }
  editing = true; render();
}

function saveEdit(){
  var t = document.getElementById('earea').value;
  var d = getDrafts(); d[String(curPage)] = t; saveDrafts(d);
  editing = false; render(); toast('Страница '+curPage+' сохранена в черновик');
}

function cancelEdit(){ editing = false; render(); }

function deletePage(){
  var pages = getAllPages();
  if(!pages.hasOwnProperty(String(curPage))){ toast('Страница не существует'); return; }
  var preview = (pages[String(curPage)] || '').substring(0, 200);
  if(preview.trim() === '') preview = '(пустая страница)';
  var pubStatus = isPub(curPage) ? 'Эта страница опубликована и видна зрителям.' : 'Эта страница существует только в черновике.';
  var h = '<div class="dlg">';
  h += '<h3>УДАЛИТЬ СТРАНИЦУ '+curPage+'?</h3>';
  h += '<div class="warn">⚠ '+pubStatus+'</div>';
  h += '<div class="prev">'+esc(preview)+'</div>';
  h += '<div class="warn">Действие необратимо. После удаления нужно нажать «СКОПИРОВАТЬ КОД» и обновить site.html.</div>';
  h += '<div class="brow"><button class="btn d" onclick="confirmDelete()">ДА, УДАЛИТЬ</button><button class="btn" onclick="closeModal()">ОТМЕНА</button></div>';
  h += '</div>';
  showModal(h);
}

function confirmDelete(){
  var d = getDrafts();
  if(isPub(curPage)) d[String(curPage)] = null;
  else delete d[String(curPage)];
  saveDrafts(d);
  var nums = getNums();
  var deletedNum = curPage;
  if(nums.length === 0){
    curPage = 1;
  } else {
    var prev = null, next = null;
    for(var i=0;i<nums.length;i++){
      if(nums[i] < deletedNum) prev = nums[i];
      if(nums[i] > deletedNum && next === null) next = nums[i];
    }
    curPage = next !== null ? next : (prev !== null ? prev : nums[0]);
  }
  closeModal();
  render();
  if(nums.length === 0) toast('Страница '+deletedNum+' удалена. Страниц больше нет.');
  else toast('Страница '+deletedNum+' удалена. Открыта страница '+curPage);
}

function showPublished(){
  var pk = Object.keys(PUBLISHED_PAGES).map(Number).sort(function(a,b){return a-b;});
  var d = getDrafts(), mc = 0;
  for(var k in d){ if(d[k]===null||!PUBLISHED_PAGES.hasOwnProperty(k)||d[k]!==PUBLISHED_PAGES[k]) mc++; }
  var h = '<h2>ВИДНЫЕ ЗРИТЕЛЯМ</h2>';
  h += '<p>Страницы, которые видят зрители (сохранены в файле site.html):</p>';
  if(pk.length === 0) h += '<p style="color:var(--d)">Нет опубликованных страниц</p>';
  else {
    h += '<div class="plist">';
    for(var i=0;i<pk.length;i++){
      var n = pk[i], prev = PUBLISHED_PAGES[String(n)].substring(0,60);
      if(PUBLISHED_PAGES[String(n)].length > 60) prev += '...';
      var mod = isModified(n);
      h += '<div class="pitem"><span>Страница '+n+(mod?' <span style="color:var(--y)">(есть черновик)</span>':'')+
        '</span><span style="color:var(--d);font-size:11px">'+esc(prev)+'</span></div>';
    }
    h += '</div>';
  }
  h += '<p style="margin-top:12px;color:var(--d);font-size:12px">Опубликовано: '+pk.length+' | Изменено в черновике: '+mc;
  h += '<br>Чтобы изменения стали видны зрителям — нажмите «СКОПИРОВАТЬ КОД» и сохраните новый site.html.</p>';
  h += '<div class="brow"><button class="btn" onclick="closeModal()">ЗАКРЫТЬ</button></div>';
  showModal(h);
}

/* ====== ГЕНЕРАЦИЯ ПОЛНОГО КОДА САЙТА ====== */
var SITE_CSS = [
  '*{margin:0;padding:0;box-sizing:border-box}',
  ':root{--c:#00f0ff;--b:#001018;--b2:#002030;--t:#c0f0ff;--d:#4080a0;--r:#ff3060;--g:#00ff80;--y:#ffaa00}',
  'body{background:var(--b);color:var(--t);font-family:"Courier New",monospace;min-height:100vh;overflow-x:hidden;background-image:linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px),radial-gradient(ellipse at center,var(--b2) 0%,var(--b) 70%);background-size:40px 40px,40px 40px,100% 100%}',
  'body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(transparent 50%,rgba(0,240,255,.02) 50%);background-size:100% 4px;pointer-events:none;z-index:9999;animation:scan 8s linear infinite}',
  '@keyframes scan{0%{background-position:0 0}100%{background-position:0 100%}}',
  '.glow{text-shadow:0 0 10px currentColor,0 0 20px currentColor}',
  '#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;background:rgba(0,16,24,.95)}',
  '#login h1{font-size:clamp(28px,8vw,64px);color:var(--c);text-shadow:0 0 20px var(--c),0 0 40px var(--c);letter-spacing:.3em;margin-bottom:8px;animation:flk 3s infinite}',

function copyCode(){
  var pages = getAllPages();
  var clean = {};
  for(var k in pages){
    if(pages[k] !== null && pages[k] !== undefined && pages[k] !== '') clean[k] = pages[k];
  }
  var json = JSON.stringify(clean);
  var js = siteJs(json, VPWD, APWD, SK);
  var L = [];
  L.push('<!DOCTYPE html>');
  L.push('<html lang="ru">');
  L.push('<head>');
  L.push('<meta charset="UTF-8">');
  L.push('<meta name="viewport" content="width=device-width, initial-scale=1.0">');
  L.push('<title>ГОЛОГРАММА</title>');
  L.push('<style>');
  L.push(SITE_CSS);
  L.push('</style>');
  L.push('</head>');
  L.push('<body>');
  L.push(SITE_HTML_PARTS);
  L.push('<script>');
  L.push(js);
  L.push('<\/script>');
  L.push('</body>');
  L.push('</html>');
  var html = L.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(html).then(function(){
      toast('Код site.html скопирован! Вставьте в файл и сохраните.');
    }).catch(function(){ showCodeModal(html); });
  } else { showCodeModal(html); }
}

function showCodeModal(html){
  var h = '<h2>КОД ДЛЯ site.html</h2><p>Скопируйте код (Ctrl+A → Ctrl+C) и вставьте в файл site.html:</p>';
  h += '<textarea readonly id="codeArea" onclick="this.select()"></textarea>';
  h += '<div class="brow"><button class="btn" onclick="closeModal()">ЗАКРЫТЬ</button></div>';
  showModal(h);
  setTimeout(function(){ document.getElementById('codeArea').value = html; }, 50);
}

function logout(){
  user = null; curPage = 1; editing = false;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('pwd').value = '';
  document.getElementById('lerr').textContent = '';
  document.getElementById('apanel').style.display = 'none';
}

function showModal(html){
  var o = document.createElement('div'); o.className='ovr'; o.id='ovr';
  o.innerHTML = '<div class="mdl">'+html+'</div>';
  o.addEventListener('click', function(e){ if(e.target===o) closeModal(); });
  document.body.appendChild(o);
}
function closeModal(){ var m=document.getElementById('ovr'); if(m) m.remove(); }

var tt;
function toast(msg){
  var ex = document.querySelector('.toast'); if(ex) ex.remove();
  var t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(tt); tt = setTimeout(function(){ t.remove(); }, 3000);
}

document.addEventListener('keydown', function(e){
  if(!user||editing) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  var nums = getNums(); if(nums.length===0) return;
  var idx = nums.indexOf(curPage);
  if(e.key==='ArrowLeft' && idx>0){ curPage=nums[idx-1]; render(); }
  else if(e.key==='ArrowRight' && idx<nums.length-1){ curPage=nums[idx+1]; render(); }
});
